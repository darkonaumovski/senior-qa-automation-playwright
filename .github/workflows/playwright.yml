name: Playwright Tests – ToDo Suite
on:
  push:
    branches: [main, 'cursor/**', 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      todo_base_url:
        description: 'External target URL (revision reported as unknown)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:harness
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate and fetch the application pin
        run: |
          pin="$(tr -d '[:space:]' < .app-commit)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git init upstream-check
          git -C upstream-check remote add origin https://github.com/cypress-io/cypress-example-kitchensink
          git -C upstream-check fetch --depth 1 origin "$pin"
          # Evidence documents may quote SHAs; runtime configuration must read the pin.
          if git grep -nE '\b[0-9a-f]{40}\b' -- Dockerfile Dockerfile.app docker-compose.yml docker-entrypoint.sh playwright.config.ts scripts .github; then
            echo "Read the pin from .app-commit in runtime configuration." >&2
            exit 1
          fi
  test:
    needs: [static, pin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Read app pin
        run: echo "APP_COMMIT=$(tr -d '[:space:]' < .app-commit)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: cypress-io/cypress-example-kitchensink
          ref: ${{ env.APP_COMMIT }}
          path: kitchensink
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --omit=dev
        working-directory: kitchensink
      - name: Start app
        working-directory: kitchensink
        run: npm start > /tmp/todo-app.log 2>&1 &
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/todo -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/todo-app.log
          exit 1
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run shard
        id: playwright
        continue-on-error: true
        env:
          TODO_BASE_URL: ${{ github.event.inputs.todo_base_url || 'http://localhost:8080' }}
          APP_SOURCE_DIR: kitchensink
          CI: 'true'
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - if: steps.playwright.outcome != 'success'
        run: exit 1
  report:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded-shards
          merge-multiple: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Expected inventory from this checkout
        env:
          INVENTORY_FILE: inventory.json
        run: npx playwright test --list --reporter=./scripts/inventory-reporter.ts
      - name: Verify both shards before any publication
        id: completeness
        run: node scripts/merge-shards.mjs downloaded-shards inventory.json .runs/merged
      - name: Surface incomplete evidence
        if: failure() && steps.completeness.outcome != 'success'
        run: echo "## Incomplete run — previous complete report retained" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true
      - name: Restore complete report history
        run: |
          if [ -d gh-pages/allure-report/history ]; then
            cp -r gh-pages/allure-report/history .runs/merged/history
          fi
      - name: Generate complete report even when test assertions failed
        run: npx allure generate .runs/merged --clean -o allure-report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runs/merged/
          retention-days: 30
      - uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && steps.completeness.outcome == 'success'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: allure-report
          keep_files: true
      - if: needs.test.result != 'success'
        run: exit 1
  docker:
    needs: [static, pin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t todo-suite:ci .
      - name: Combined image smoke and baked revision
        run: |
          docker run --rm -e CI=true -v "${PWD}/.runs:/workspace/.runs" todo-suite:ci --grep @smoke --project=chromium --retries=0
          docker run --rm --entrypoint cat todo-suite:ci /opt/kitchensink/.qa-revision | diff - .app-commit
      - name: Build and run separate Compose service
        run: |
          docker compose build
          docker compose up -d --wait app
          docker compose exec -T app wget -qO- http://localhost:8080/todo > /dev/null
          docker compose run --rm tests --project=chromium --grep @smoke --retries=0
          node scripts/check-revisions.mjs "$(tr -d '[:space:]' < .app-commit)"
      - name: Prove a failing browser assertion propagates exit code 1
        run: |
          cat > ci-failure.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';
          test('deliberate delivery probe', async ({ page }) => {
            await page.goto('/todo');
            await expect(page.locator('.new-todo')).toHaveAttribute('data-delivery-probe', 'deliberate failure', { timeout: 1000 });
          });
          EOF
          set +e
          docker compose run --rm -v "${PWD}/ci-failure.spec.ts:/workspace/tests/ci-failure.spec.ts:ro" tests ci-failure.spec.ts --project=chromium --retries=0
          result=$?
          set -e
          test "$result" -eq 1
      - name: Build override provenance
        run: |
          # A second valid pin is supplied explicitly to both independent builds.
          override="$(git ls-remote https://github.com/cypress-io/cypress-example-kitchensink HEAD | cut -f1)"
          docker build --build-arg APP_COMMIT="$override" -t todo-suite:override .
          docker run --rm --entrypoint cat todo-suite:override /opt/kitchensink/.qa-revision | grep -Fx "$override"
          docker run --rm -e CI=true -v "${PWD}/.runs:/workspace/.runs" todo-suite:override --project=chromium tests/todo/add.spec.ts --grep 'single todo' --retries=0
          APP_COMMIT="$override" docker compose build app
          docker compose up -d --wait --force-recreate app
          docker compose run --rm tests --project=chromium tests/todo/add.spec.ts --grep 'single todo' --retries=0
          node scripts/check-revisions.mjs "$override"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runs/
            test-results/
            playwright-report/
          include-hidden-files: true
          retention-days: 14
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
