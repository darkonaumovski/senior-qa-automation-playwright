name: Playwright Tests – ToDo Suite

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]
  # Allow manual triggers with optional custom base-URL
  workflow_dispatch:
    inputs:
      todo_base_url:
        description: 'Base URL of the ToDo application (leave blank for localhost)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The commit of cypress-example-kitchensink to test against is not declared
# here: it lives in .app-commit and is read into APP_COMMIT per job. Pinning it
# keeps a failure attributable to this suite rather than to an upstream change
# landing mid-run, and keeping it in one file stops the workflow, the two
# Dockerfiles and the compose stack from drifting apart. The `pin` job below
# fails the build if the SHA is written down anywhere else again.

jobs:
  # Fast feedback: compile and lint the suite before spending runner time on
  # browsers.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint

  # Guards the single source of truth. Without this, .app-commit is just a
  # convention and a copy-pasted SHA can quietly reappear.
  pin:
    name: Check the app pin is single-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate the .app-commit format
        run: |
          pin="$(tr -d '[:space:]' < .app-commit)"
          if ! printf '%s' "$pin" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: .app-commit must hold one full 40-character commit SHA, got '${pin}'." >&2
            exit 1
          fi
          echo "Pinned application commit: ${pin}"

      - name: Confirm the commit exists upstream
        run: |
          pin="$(tr -d '[:space:]' < .app-commit)"
          git init upstream-check
          cd upstream-check
          git remote add origin https://github.com/cypress-io/cypress-example-kitchensink
          if ! git fetch --depth 1 origin "${pin}"; then
            echo "ERROR: ${pin} is not fetchable from cypress-example-kitchensink." >&2
            exit 1
          fi

      - name: Fail if a 40-character SHA is hard-coded anywhere else
        run: |
          # Anything tracked, except .app-commit itself and the lockfile (whose
          # integrity hashes are not commit SHAs).
          offenders="$(git ls-files \
            | grep -v -e '^\.app-commit$' -e '^package-lock\.json$' \
            | xargs grep -l -E '\b[0-9a-f]{40}\b' 2>/dev/null || true)"
          if [ -n "${offenders}" ]; then
            echo "ERROR: a 40-character SHA is hard-coded outside .app-commit:" >&2
            echo "${offenders}" >&2
            echo "Read the pin from .app-commit instead." >&2
            exit 1
          fi
          echo "No hard-coded SHAs outside .app-commit."

  test:
    name: Run Playwright tests
    needs: [static, pin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required by peaceiris/actions-gh-pages when publishing the Allure report.
    permissions:
      contents: write

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Resolve the pinned application commit
        run: echo "APP_COMMIT=$(tr -d '[:space:]' < .app-commit)" >> "$GITHUB_ENV"

      # ── App setup ─────────────────────────────────────────────────────────────
      - name: Checkout cypress-example-kitchensink (app under test)
        uses: actions/checkout@v4
        with:
          repository: cypress-io/cypress-example-kitchensink
          ref: ${{ env.APP_COMMIT }}
          path: kitchensink

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        working-directory: kitchensink
        # --ignore-scripts skips the husky post-install hook in the kitchensink repo
        run: npm install --ignore-scripts --omit=dev

      - name: Start ToDo application in background
        working-directory: kitchensink
        run: |
          npm start &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for application to be ready
        run: |
          echo "Waiting for http://localhost:8080/todo ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/todo -o /dev/null; then
              echo "Application is ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Application did not start within 30s." >&2
          exit 1

      # ── Test setup ────────────────────────────────────────────────────────────
      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Set up Java (required by allure-commandline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Allure history (download previous report for trend data) ──────────────
      - name: Download previous Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true  # branch may not exist on first run

      - name: Restore Allure history from previous run
        run: |
          if [ -d gh-pages/allure-report/history ]; then
            echo "Restoring Allure history for trend graphs ..."
            mkdir -p allure-results
            cp -r gh-pages/allure-report/history allure-results/history
          else
            echo "No previous history found – this appears to be the first run."
          fi
        continue-on-error: true

      # ── Run tests ────────────────────────────────────────────────────────────
      - name: Run Playwright tests
        env:
          TODO_BASE_URL: ${{ github.event.inputs.todo_base_url || 'http://localhost:8080' }}
          CI: 'true'
          APP_COMMIT: ${{ env.APP_COMMIT }}
        run: npm test
        # Always collect results even if tests fail
        continue-on-error: true
        id: playwright

      # ── Reports ──────────────────────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report
          echo "Allure report generated at allure-report/"

      - name: Upload Allure results (raw)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results/
          retention-days: 30

      - name: Upload Allure report (HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright traces and videos on failure
        uses: actions/upload-artifact@v4
        if: failure() || steps.playwright.outcome == 'failure'
        with:
          name: playwright-traces-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      # ── Deploy Allure report to GitHub Pages ──────────────────────────────────
      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: allure-report
          keep_files: true   # preserve previous reports for history navigation

      # ── Final status ─────────────────────────────────────────────────────────
      - name: Fail workflow if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  # -- Docker deliverable ------------------------------------------------------
  # The assignment asks for an image containing the application and the tests.
  # Reviewing the Dockerfile proves nothing, so build it and run the suite
  # through docker compose exactly as a reviewer would.
  docker:
    name: Build image and run suite in Docker
    needs: [static, pin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the pinned application commit
        run: echo "APP_COMMIT=$(tr -d '[:space:]' < .app-commit)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No --build-arg: the Dockerfile reads .app-commit itself, so building by
      # hand and building here cannot disagree about the app revision.
      - name: Build the combined app + tests image
        run: docker build -t todo-suite:ci .

      # This is the assignment deliverable: one image that holds the application,
      # the tests and their dependencies. Running it also exercises
      # docker-entrypoint.sh, which starts the app, waits for it, and has to
      # propagate the suite's exit code rather than the app shutdown's.
      - name: Run the suite inside the image
        run: |
          docker run --rm \
            -e CI=true \
            -e APP_COMMIT="${APP_COMMIT}" \
            -v "${PWD}/allure-results:/workspace/allure-results" \
            todo-suite:ci

      # The compose stack is the split app/tests topology. Building it verifies
      # Dockerfile.app and the service definitions without paying for a second
      # full suite run.
      - name: Build the compose stack
        run: docker compose build

      - name: Upload Allure results from the Docker run
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-docker-${{ github.run_number }}
          path: allure-results/
          retention-days: 14

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
